# Standalone deployment: builds the image and serves the static game on :8017.
# There is no game server. RENDEZVOUS_URL is where the client looks for the
# rendezvous server; empty falls back to the origin the page came from.
services:
  waldo-royale:
    build:
      context: .
      args:
        RENDEZVOUS_URL: ${RENDEZVOUS_URL:-}
    container_name: waldo-royale
    restart: unless-stopped
    ports:
      - "8017:8080"
