<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waldo Royale</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1026; color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  .red { color: #ff5a5a; }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5; }
  .screen.show { display: flex; }
  .card {
    width: min(440px, 92vw); padding: 32px 36px; border-radius: 18px;
    background: linear-gradient(160deg, #1a2150, #101538);
    border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .card h1 { font-size: 30px; margin-bottom: 4px; }
  .card .sub { opacity: 0.7; font-size: 13px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; opacity: 0.75; margin-bottom: 5px; letter-spacing: 0.5px; }
  input, select {
    width: 100%; padding: 11px 14px; border-radius: 10px; font-family: inherit; font-size: 15px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; outline: none;
  }
  input:focus, select:focus { border-color: #ff5a5a; }
  select option { background: #1a2150; }
  .btn {
    width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 999px;
    font-size: 15px; font-weight: bold; letter-spacing: 0.5px;
    background: #ff5a5a; color: #fff;
  }
  .btn.secondary { background: rgba(255,255,255,0.12); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .split { display: flex; gap: 10px; }
  .split > * { flex: 1; }
  .divider { text-align: center; opacity: 0.5; font-size: 12px; margin: 18px 0 14px; }

  /* ---------- lobby ---------- */
  #lobbyCode { font-size: 40px; font-weight: bold; letter-spacing: 10px; text-align: center;
    color: #ffe14a; margin: 6px 0 2px; }
  .code-hint { text-align: center; font-size: 12px; opacity: 0.65; margin-bottom: 18px; }
  #playerList { list-style: none; margin-bottom: 16px; max-height: 180px; overflow-y: auto; }
  #playerList li { padding: 8px 12px; border-radius: 8px; margin-bottom: 5px;
    background: rgba(255,255,255,0.07); font-size: 14px; display: flex; justify-content: space-between; }
  #playerList .host-tag { color: #ffe14a; font-size: 12px; }
  #hostControls .field { margin-bottom: 10px; }
  #waitingMsg { text-align: center; opacity: 0.7; font-size: 13px; margin-top: 8px; }

  /* ---------- game ---------- */
  canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important;
    touch-action: none; cursor: crosshair; z-index: 0; }
  #gameHud { display: none; }
  #gameHud.show { display: block; }
  .hud { position: fixed; z-index: 10; user-select: none; }

  #roundInfo { top: 14px; left: 18px; font-size: 15px; font-weight: bold;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #roundInfo small { display: block; font-weight: normal; font-size: 11px; opacity: 0.75; }

  #timerWrap { top: 14px; right: 18px; width: 130px; text-align: right; }
  #timerText { font-size: 22px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #timerBar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); margin-top: 5px; overflow: hidden; }
  #timerFill { height: 100%; width: 100%; background: #4caf50; border-radius: 3px; }


  #zoomer { bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; }
  #zoomer button { width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(10,14,40,0.65);
    color: #fff; font-size: 24px; line-height: 1; }

  #foundBanner { bottom: 18px; left: 50%; transform: translateX(-50%);
    padding: 13px 42px; border-radius: 999px; font-size: 15px; font-weight: bold;
    letter-spacing: 1px; background: #ffe14a; color: #1a1a2e; }
  #foundBanner span { font-weight: normal; }

  #foundCount { bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 12px;
    opacity: 0.8; background: rgba(10,14,40,0.65); padding: 5px 14px; border-radius: 999px; }

  #toast { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold;
    padding: 8px 20px; border-radius: 10px; background: rgba(200,40,40,0.92);
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50; }
  #toast.show { opacity: 1; }
  #toast.info { background: rgba(10,14,40,0.92); color: #ffe14a;
    border: 1px solid rgba(255,225,74,0.35); }

  /* ---------- results ---------- */
  #results .card, #final .card { width: min(520px, 94vw); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0 16px; }
  th { text-align: left; font-size: 11px; letter-spacing: 1px; opacity: 0.6; padding: 4px 8px; }
  td { padding: 7px 8px; background: rgba(255,255,255,0.06); }
  tr td:first-child { border-radius: 8px 0 0 8px; }
  tr td:last-child { border-radius: 0 8px 8px 0; text-align: right; }
  td.score { color: #ffe14a; font-weight: bold; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
  #nextIn { text-align: center; font-size: 13px; opacity: 0.75; }
  #final h1 { text-align: center; }
  #trophy { font-size: 64px; animation: bounce 1.2s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #winnerName { font-size: 34px; color: #ffe14a; margin-top: 4px; }
  #podium { list-style: none; margin: 18px 0; }
  #podium li { display: flex; justify-content: space-between; padding: 10px 14px;
    border-radius: 10px; margin-bottom: 6px; background: rgba(255,255,255,0.07); font-size: 15px; }
  #podium li:first-child { background: linear-gradient(90deg, rgba(255,225,74,0.25), rgba(255,225,74,0.08));
    border: 1px solid rgba(255,225,74,0.4); font-weight: bold; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
  // winit escapes its never-returning event loop on wasm by throwing a
  // deliberate exception; keep it out of the console.
  addEventListener('error', (e) => {
    if (String(e.error?.message ?? e.message).includes('Using exceptions for control flow')) {
      e.preventDefault();
    }
  });
  addEventListener('unhandledrejection', (e) => {
    if (String(e.reason?.message ?? e.reason).includes('Using exceptions for control flow')) {
      e.preventDefault();
    }
  });
  // The entire client is one Rust wasm module: Leptos UI + three-d renderer.
  import init from './pkg/waldo_client.js';
  await init();
</script>
</body>
</html>
