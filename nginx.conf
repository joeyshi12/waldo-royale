server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # wasm needs its own type or the browser refuses to stream-compile it
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # The wasm and the page have to move together: a cached bundle talking to a peer
    # on newer code is the failure this avoids. The assets are content addressed by
    # nothing, so they get the same treatment.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
