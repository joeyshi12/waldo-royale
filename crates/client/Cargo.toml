[package]
name = "waldo-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
waldo-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
leptos = { version = "0.8.15", features = ["csr"] }
three-d = "=0.19.0"
three-d-asset = { version = "=0.10.0", features = ["gltf", "image", "http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "MessageEvent", "Location", "Window", "Performance", "Storage",
  # the rendezvous server: one socket, held for the session
  "WebSocket", "BinaryType", "CloseEvent",
  # the peer connections the rendezvous server introduces
  "RtcPeerConnection", "RtcConfiguration", "RtcDataChannel", "RtcDataChannelEvent",
  "RtcDataChannelState", "RtcSessionDescriptionInit", "RtcSdpType", "RtcSessionDescription",
  "RtcIceCandidate", "RtcPeerConnectionIceEvent", "RtcIceGatheringState",
] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
