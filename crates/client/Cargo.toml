[package]
name = "waldo-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
waldo-core = { path = "../core" }
serde_json = { workspace = true }
leptos = { version = "0.8.15", features = ["csr"] }
three-d = "=0.19.0"
three-d-asset = { version = "=0.10.0", features = ["gltf", "image", "http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Location", "Window", "Performance", "Storage"] }
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
